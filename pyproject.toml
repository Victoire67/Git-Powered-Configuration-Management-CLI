[project]
name = "gitconfig-cli"
version = "0.1.0"
description = ""
authors = [
    {name = "victoire67",email = "ansimavicky@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "gitpython (>=3.2.1,<4.0.0)",
    "click (>=8.5.0,<9.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "structlog (>=26.1.0,<27.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "gitconfig_cli", from = "src" }]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-mock (>=3.16.0,<4.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "ruff (>=0.17.0,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "types-pyyaml (>=6.0.12.20260906,<7.0.0.0)"
]
